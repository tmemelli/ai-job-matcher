name: Integração Contínua (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-setup:
    runs-on: ubuntu-latest
    
    # --- NOVO: Variáveis falsas para enganar o código durante o teste ---
    env:
      OPENAI_API_KEY: "sk-proj-chave-falsa-apenas-para-teste-ci"
      APP_PASSWORD: "senha-teste"
    # ------------------------------------------------------------------

    steps:
    - name: 📥 Baixar código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: 📦 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        # Instala exatamente o que você tem no PC
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Garante as libs de teste
        pip install pytest httpx

    - name: 🧪 Teste de Fumaça (Smoke Test)
      run: |
        # Agora isso vai funcionar porque a chave falsa existe no ambiente
        python -c "from src.agent import analyze_candidate_with_tools; print('✅ Módulo Agent: Carregou com sucesso!')"
        python -c "from src.tools import search_candidate_online; print('✅ Módulo Tools: Carregou com sucesso!')"